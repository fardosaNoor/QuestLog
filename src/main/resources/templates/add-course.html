
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Course | QuestLog</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <nav class="navbar">
        <a class="logo" th:href="@{/dashboard}">✦ QuestLog</a>
        <a th:href="@{/dashboard}">Back to Dashboard</a>
    </nav>

    <main>
        <section class="card">
            <h1>📚 Add a Course</h1>
            <p>Add a course to your semester.</p>

            <form th:action="@{/courses}" method="post">
                <label for="code">Course code</label>
                <input id="code" name="code" type="text"
                       placeholder="CMPT 276" maxlength="30" required>

                <label for="name">Course name</label>
                <input id="name" name="name" type="text"
                       placeholder="Introduction to Software Engineering"
                       maxlength="120" required>

                <label for="semester">Semester</label>
                <input id="semester" name="semester" type="text"
                       placeholder="Fall 2026" maxlength="40" required>

                <button type="submit">Save Course</button>
            </form>
        </section>
    </main>

</body>
</html>
