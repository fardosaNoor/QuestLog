<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Profile - QuestLog</title>
</head>
<body>

    <h1>Edit Profile</h1>

    <form th:action="@{/profile/edit}" method="post">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <label for="name">Display Name:</label>

        <input type="text"
               id="name"
               name="name"
               th:value="${user.name}"
               maxlength="100"
               required>

        <button type="submit">Save Changes</button>

    </form>

    <a th:href="@{/profile}">Cancel</a>

</body>
</html>
